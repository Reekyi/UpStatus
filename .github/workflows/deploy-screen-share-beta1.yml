name: UpStatus Deploy Screen Share Beta 3.1.1-beta1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: dlfvkawaiqduhlazsszm
    steps:
      - name: Checkout beta branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Validate build
        run: node scripts/validate.mjs
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: latest
      - name: Deploy dedicated beta endpoint only
        run: supabase functions deploy upstatus-screen-share-3-1-1-beta1 --project-ref "$SUPABASE_PROJECT_ID" --use-api
