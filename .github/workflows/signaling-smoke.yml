name: UpStatus Signaling Smoke Tests

on:
  pull_request:
    branches:
      - master
      - chore/continuity-foundation
    paths:
      - "scripts/test-signaling-endpoint.mjs"
      - "scripts/test-signaling-authenticated.mjs"
      - "scripts/run-signaling-authenticated.mjs"
      - "scripts/test-signaling-browser.mjs"
      - "scripts/signaling-static.test.mjs"
      - "scripts/screen-share-recovery.test.mjs"
      - "scripts/voice-room-attempt-recovery.test.mjs"
      - "scripts/chat-regression.test.mjs"
      - "scripts/test-chat-read-receipts.mjs"
      - "scripts/test-signal-rate-limit.mjs"
      - "scripts/test-setup-invite-rate-limit.mjs"
      - "scripts/assert-isolated-supabase.mjs"
      - "scripts/isolation-guard.test.mjs"
      - "scripts/migration-layout.test.mjs"
      - "scripts/auth-enrollment.test.mjs"
      - "scripts/test-auth-enrollment.mjs"
      - "supabase/migrations/**"
      - "supabase/test-migrations/**"
      - "src/server/index.template.ts"
      - "scripts/signaling-transport.test.mjs"
      - "src/userscript/signaling-transport.mjs"
      - "scripts/signaling-body.test.mjs"
      - "supabase/functions/upstatus-signal-test/body.mjs"
      - ".github/workflows/signaling-smoke.yml"
      - "supabase/functions/upstatus-signal-test/index.ts"
      - "src/userscript/upstatus.user.template.js"
      - "supabase/migrations/**"
      - "docs/REALTIME_SIGNALING_PROTOTYPE.md"
  workflow_dispatch:

# Normal and Team Lite share the same isolated Supabase fixture project.
# Serialize fixture-mutating suites to prevent cross-product fixture races.
concurrency:
  group: upstatus-signaling-isolated-tests
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Validate complete Normal and TEST build
        run: node scripts/validate.mjs
      # Includes chat read-receipt concurrency regression and the atomic migration contract.
      - name: Syntax-check signaling test harnesses
        run: |
          node --check scripts/test-signaling-endpoint.mjs
          node --check scripts/signaling-test-request.mjs
          node --check scripts/signaling-test-request.test.mjs
          node scripts/signaling-test-request.test.mjs
          node --check scripts/test-signaling-authenticated.mjs
          node --check scripts/run-signaling-authenticated.mjs
          node --check scripts/test-signaling-browser.mjs
          node --check scripts/signaling-static.test.mjs
          node scripts/signaling-static.test.mjs
          node --check scripts/screen-share-recovery.test.mjs
          node scripts/screen-share-recovery.test.mjs src/userscript/upstatus.user.template.js
          node --check scripts/voice-room-attempt-recovery.test.mjs
          node scripts/voice-room-attempt-recovery.test.mjs
          node --check scripts/signaling-body.test.mjs
          node scripts/signaling-body.test.mjs
          node --check scripts/signaling-envelope.test.mjs
          node scripts/signaling-envelope.test.mjs
          node --check scripts/signaling-transport.test.mjs
          node scripts/signaling-transport.test.mjs
          node --check scripts/assert-isolated-supabase.mjs
          node --check scripts/isolation-guard.test.mjs
          node scripts/isolation-guard.test.mjs
          node --check scripts/migration-layout.test.mjs
          node scripts/migration-layout.test.mjs
          node --check scripts/auth-enrollment.test.mjs
          node scripts/auth-enrollment.test.mjs normal
          node --check scripts/test-auth-enrollment.mjs
          node --check scripts/test-chat-read-receipts.mjs
          node --check scripts/test-signal-rate-limit.mjs
      - name: Syntax-check setup invite rate-limit harness when present
        if: hashFiles('scripts/test-setup-invite-rate-limit.mjs') != ''
        run: node --check scripts/test-setup-invite-rate-limit.mjs
      - name: Run unauthenticated endpoint checks against isolated project
        env:
          UPSTATUS_SIGNAL_URL: https://bfpjtfqlnypisxljoxkb.supabase.co/functions/v1/upstatus-signal-test
        run: node scripts/test-signaling-endpoint.mjs
      - name: Run authenticated isolated integration and browser tests
        env:
          SUPABASE_URL: https://bfpjtfqlnypisxljoxkb.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UPSTATUS_SIGNAL_TEST_SERVICE_ROLE_KEY }}
          UPSTATUS_SIGNAL_ALLOW_MUTATION: "1"
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::UPSTATUS_SIGNAL_TEST_SERVICE_ROLE_KEY is required; refusing to skip isolated fixture tests."
            exit 1
          fi
          npm install --no-save --package-lock=false playwright@1.64.1
          npx playwright install --with-deps chromium
          node scripts/run-signaling-authenticated.mjs
      - name: Verify distributed signaling rate-limit concurrency
        env:
          SUPABASE_URL: https://bfpjtfqlnypisxljoxkb.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UPSTATUS_SIGNAL_TEST_SERVICE_ROLE_KEY }}
          UPSTATUS_SIGNAL_ALLOW_MUTATION: "1"
        run: node scripts/test-signal-rate-limit.mjs
      - name: Verify atomic chat read-receipt concurrency
        env:
          SUPABASE_URL: https://bfpjtfqlnypisxljoxkb.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UPSTATUS_SIGNAL_TEST_SERVICE_ROLE_KEY }}
          UPSTATUS_SIGNAL_ALLOW_MUTATION: "1"
        run: node scripts/test-chat-read-receipts.mjs
      - name: Verify one-time setup invite atomic consumption
        env:
          SUPABASE_URL: https://bfpjtfqlnypisxljoxkb.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UPSTATUS_SIGNAL_TEST_SERVICE_ROLE_KEY }}
          UPSTATUS_AUTH_ALLOW_MUTATION: "1"
        run: node scripts/test-auth-enrollment.mjs
      - name: Verify distributed setup-invite issuance rate limit
        if: hashFiles('scripts/test-setup-invite-rate-limit.mjs') != ''
        env:
          SUPABASE_URL: https://bfpjtfqlnypisxljoxkb.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UPSTATUS_SIGNAL_TEST_SERVICE_ROLE_KEY }}
          UPSTATUS_AUTH_ALLOW_MUTATION: "1"
        run: node scripts/test-setup-invite-rate-limit.mjs
