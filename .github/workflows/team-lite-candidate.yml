name: Team Lite Candidate Checks

on:
  push:
    branches: [team-lite/3.4.31-guest-fixes, team-lite/signaling-transport-candidate]
    paths:
      - "team-lite/**"
      - "lucca-site/**"
      - "lucca.html"
      - "ycaro.html"
      - "scripts/team-lite-candidate-check.mjs"
      - "scripts/test-signaling-endpoint.mjs"
      - "scripts/test-signaling-authenticated.mjs"
      - "scripts/run-signaling-authenticated.mjs"
      - "scripts/test-signaling-browser.mjs"
      - ".github/workflows/team-lite-candidate.yml"
  pull_request:
    branches: [team-lite-official]
    paths:
      - "team-lite/**"
      - "lucca-site/**"
      - "lucca.html"
      - "ycaro.html"
      - "scripts/team-lite-candidate-check.mjs"
      - "scripts/test-signaling-endpoint.mjs"
      - "scripts/test-signaling-authenticated.mjs"
      - "scripts/run-signaling-authenticated.mjs"
      - "scripts/test-signaling-browser.mjs"
      - ".github/workflows/team-lite-candidate.yml"

concurrency:
  group: upstatus-signaling-isolated-tests-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  candidate-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Test authenticated signaling adapter
        run: node scripts/signaling-transport.test.mjs
      - name: Test isolated signaling endpoint authentication
        env:
          UPSTATUS_SIGNAL_URL: https://bfpjtfqlnypisxljoxkb.supabase.co/functions/v1/upstatus-signal-test
        run: node scripts/test-signaling-endpoint.mjs
      - name: Run authenticated isolated integration and browser tests when secret is configured
        env:
          SUPABASE_URL: https://bfpjtfqlnypisxljoxkb.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UPSTATUS_SIGNAL_TEST_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SKIP: UPSTATUS_SIGNAL_TEST_SERVICE_ROLE_KEY is not configured; authenticated HTTP and browser tests were not run."
            exit 0
          fi
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          node scripts/run-signaling-authenticated.mjs
      - name: Check candidate scripts and version metadata
        run: node scripts/team-lite-candidate-check.mjs
