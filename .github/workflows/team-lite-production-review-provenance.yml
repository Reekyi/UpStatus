name: Team Lite Production Review Provenance

on:
  push:
    branches:
      - fix/team-lite-production-review-provenance-20261109
    paths:
      - ".github/workflows/deploy-team-lite-production.yml"
      - ".github/workflows/team-lite-production-review-provenance.yml"
      - "scripts/verify-team-lite-release-review.mjs"
      - "scripts/verify-team-lite-release-checks.mjs"
      - "scripts/test-team-lite-production-dispatcher.mjs"
  pull_request:
    branches:
      - fix/team-lite-production-dispatcher-master-20261109
    paths:
      - ".github/workflows/deploy-team-lite-production.yml"
      - ".github/workflows/team-lite-production-review-provenance.yml"
      - "scripts/verify-team-lite-release-review.mjs"
      - "scripts/verify-team-lite-release-checks.mjs"
      - "scripts/test-team-lite-production-dispatcher.mjs"

permissions:
  contents: read

jobs:
  review_provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact dispatcher candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check review provenance syntax
        run: |
          node --check scripts/verify-team-lite-release-review.mjs
          node --check scripts/verify-team-lite-release-checks.mjs
          node --check scripts/test-team-lite-production-dispatcher.mjs
      - name: Run offline current-head approval contracts
        run: node scripts/test-team-lite-production-dispatcher.mjs
