name: UpStatus Validate

on:
  push:
    branches:
      - master
      - develop
      - "fix/normal-signal-http-error-code-shape-20261108-v2"
      - "fix/normal-signal-room-capacity-20261109-v2"
      - "feat/normal-signal-db-readiness-20261109"
      - "fix/normal-signal-readiness-schema-usage-20261109"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches:
      - master
      - develop
      - "fix/normal-signal-http-error-code-shape-20261108-v2"
      - "fix/normal-signal-room-capacity-20261109-v2"
      - "feat/normal-signal-event-idempotency-20261109-v2"
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test TEST build target guard
        run: node scripts/test-build-target-guard.mjs
      - name: Validate build
        run: node scripts/validate.mjs
