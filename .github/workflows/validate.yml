name: UpStatus Validate

on:
  push:
    branches: [master, develop]
  pull_request:
    # Include the staged-chat parent so stacked API/dispatcher PRs receive a base-branch check.
    branches: [master, develop, fix/master-staged-chat-attachments-20261111]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Validate build
        run: node scripts/validate.mjs
