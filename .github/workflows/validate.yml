name: UpStatus Validate

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Test TEST build target guard
        run: node scripts/test-build-target-guard.mjs
      - name: Test dedicated TEST project metadata guard
        run: node scripts/test-test-project-preflight.mjs
      - name: Test TEST deploy workflow secret scope
        run: node scripts/test-deploy-workflow-guard.mjs
      - name: Validate build
        run: node scripts/validate.mjs
