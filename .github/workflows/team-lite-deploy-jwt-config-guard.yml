name: Team Lite Deploy JWT Config Guard

on:
  push:
    branches:
      - fix/team-lite-deploy-jwt-config-guard-20261108
    paths:
      - "supabase/config.toml"
      - "scripts/test-function-jwt-config.mjs"
      - ".github/workflows/team-lite-deploy-jwt-config-guard.yml"
      - ".github/workflows/team-lite-candidate.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Verify custom-auth function configuration
        run: |
          node --check scripts/test-function-jwt-config.mjs
          node scripts/test-function-jwt-config.mjs upstatus-team-lite
