name: Production Signaling Source Parity

on:
  push:
    branches:
      - chore/continuity-foundation
      - feat/production-authenticated-signaling-runtime-20261108
      - fix/production-signal-pr-check-base-20261110
    paths:
      - "supabase/functions/upstatus-signal/**"
      - "supabase/functions/upstatus-signal-test/**"
      - "supabase/migrations/20261108190000_distributed_signaling_rate_limit.sql"
      - "supabase/config.toml"
      - "scripts/production-signal-source-parity.test.mjs"
      - "scripts/validate.mjs"
      - ".github/workflows/production-signal-source-parity.yml"
  pull_request:
    branches:
      - chore/continuity-foundation
    paths:
      - "supabase/functions/upstatus-signal/**"
      - "supabase/functions/upstatus-signal-test/**"
      - "supabase/migrations/20261108190000_distributed_signaling_rate_limit.sql"
      - "supabase/config.toml"
      - "scripts/production-signal-source-parity.test.mjs"
      - "scripts/validate.mjs"
      - ".github/workflows/production-signal-source-parity.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Node runtime
        run: node --version
      - name: Run source parity when the production candidate is present
        run: |
          if [ -f scripts/production-signal-source-parity.test.mjs ] && [ -f supabase/functions/upstatus-signal/index.ts ] && [ -f supabase/functions/upstatus-signal-test/index.ts ]; then
            node --check scripts/production-signal-source-parity.test.mjs
            node scripts/production-signal-source-parity.test.mjs
          else
            echo "::notice::Production signaling source is not part of this base yet; parity validation will run when the candidate PR introduces it."
          fi
      - name: Run complete offline Normal validation
        run: node scripts/validate.mjs
