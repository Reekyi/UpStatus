name: UpStatus Deploy TEST

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_TEST_PROJECT_ID: ${{ vars.SUPABASE_TEST_PROJECT_ID }}
      UPSTATUS_TEST_PROJECT_ID: ${{ vars.SUPABASE_TEST_PROJECT_ID }}
      EXPECTED_PRODUCTION_PROJECT_ID: dlfvkawaiqduhlazsszm
      EXPECTED_ISOLATED_SIGNALING_PROJECT_ID: bfpjtfqlnypisxljoxkb
    steps:
      - name: Checkout develop
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: develop
          persist-credentials: false
      - name: Require a dedicated TEST project and credentials
        run: |
          if [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "::error::TEST deploy is allowed only from refs/heads/develop."
            exit 1
          fi
          if [ -z "$SUPABASE_TEST_PROJECT_ID" ]; then
            echo "::error::vars.SUPABASE_TEST_PROJECT_ID is required; refusing to deploy TEST."
            exit 1
          fi
          if [ "$SUPABASE_TEST_PROJECT_ID" = "$EXPECTED_PRODUCTION_PROJECT_ID" ]; then
            echo "::error::Refusing to deploy TEST to the production Supabase project."
            exit 1
          fi
          if [ "$SUPABASE_TEST_PROJECT_ID" = "$EXPECTED_ISOLATED_SIGNALING_PROJECT_ID" ]; then
            echo "::error::The signaling/auth fixture project is not a full product TEST environment."
            exit 1
          fi
          if ! [[ "$SUPABASE_TEST_PROJECT_ID" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::SUPABASE_TEST_PROJECT_ID must be a 20-character lowercase Supabase project reference."
            exit 1
          fi
          if [ "$UPSTATUS_TEST_PROJECT_ID" != "$SUPABASE_TEST_PROJECT_ID" ]; then
            echo "::error::Build and deploy TEST project IDs do not match."
            exit 1
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is required."
            exit 1
          fi
      - name: Test TEST build target guard
        run: node scripts/test-build-target-guard.mjs
      - name: Validate build
        run: node scripts/validate.mjs
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.122.1
      - name: Deploy TEST only
        run: supabase functions deploy upstatus-test --project-ref "$SUPABASE_TEST_PROJECT_ID" --use-api
