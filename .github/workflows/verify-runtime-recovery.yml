name: Verify Recovered Normal Runtime

on:
  push:
    branches: [chore/cleanup-structure-347]
    paths:
      - "src/server/normal-3.4.7.recovered.template.ts"
      - "src/server/normal-3.4.7/**"
      - "recovery/runtime-2026-11-26/**"
      - "scripts/verify-normal-runtime-recovery.mjs"
      - "scripts/test-normal-http-helpers.mjs"
      - "scripts/test-normal-state-store.mjs"
      - "scripts/test-normal-auth-crypto.mjs"
      - "scripts/test-normal-guest-sessions.mjs"
      - "scripts/test-normal-members.mjs"
      - "scripts/test-normal-status.mjs"
      - "scripts/test-normal-remote-status.mjs"
      - "scripts/test-normal-chat-data.mjs"
      - "scripts/test-normal-media.mjs"
      - "scripts/test-normal-auth-context.mjs"
      - "scripts/test-normal-chat-route.mjs"
      - "scripts/test-normal-media-routes.mjs"
      - "scripts/test-normal-guest-routes.mjs"
      - "scripts/test-normal-chat-interaction-routes.mjs"
      - "scripts/test-normal-auth-core.mjs"
      - "scripts/test-normal-auth-routes.mjs"
      - "scripts/test-normal-chat-maintenance.mjs"
      - "scripts/test-normal-modular-integration.mjs"
      - "scripts/test-normal-chat-integration.mjs"
      - "scripts/test-normal-media-integration.mjs"
      - "scripts/test-normal-status-integration.mjs"
      - "scripts/deno-entrypoint-test/**"
      - "scripts/build-normal-modular-candidate.mjs"
      - "src/server/normal-3.4.7/modules/**"
      - "ycaro.html"
      - ".github/workflows/verify-runtime-recovery.yml"
  pull_request:
    branches: [master, develop]
    paths:
      - "src/server/normal-3.4.7.recovered.template.ts"
      - "recovery/runtime-2026-11-26/**"
      - "scripts/verify-normal-runtime-recovery.mjs"
      - "ycaro.html"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Verify exact recovered runtime
        run: node scripts/verify-normal-runtime-recovery.mjs
      - name: Test extracted HTTP helpers
        run: node scripts/test-normal-http-helpers.mjs
      - name: Test shared state module
        run: node scripts/test-normal-state-store.mjs
      - name: Test authentication crypto module
        run: node scripts/test-normal-auth-crypto.mjs
      - name: Test guest session module
        run: node scripts/test-normal-guest-sessions.mjs
      - name: Test members cache module
        run: node scripts/test-normal-members.mjs
      - name: Test status handlers module
        run: node scripts/test-normal-status.mjs
      - name: Test remote status module
        run: node scripts/test-normal-remote-status.mjs
      - name: Test chat data module
        run: node scripts/test-normal-chat-data.mjs
      - name: Test media module
        run: node scripts/test-normal-media.mjs
      - name: Test auth context module
        run: node scripts/test-normal-auth-context.mjs
      - name: Test chat route module
        run: node scripts/test-normal-chat-route.mjs
      - name: Test media routes module
        run: node scripts/test-normal-media-routes.mjs
      - name: Test guest HTTP routes module
        run: node scripts/test-normal-guest-routes.mjs
      - name: Test chat interaction routes module
        run: node scripts/test-normal-chat-interaction-routes.mjs
      - name: Test authentication core module
        run: node scripts/test-normal-auth-core.mjs
      - name: Test authentication endpoint routes module
        run: node scripts/test-normal-auth-routes.mjs
      - name: Test chat maintenance module
        run: node scripts/test-normal-chat-maintenance.mjs
      - name: Test integrated modular composition
        run: node scripts/test-normal-modular-integration.mjs
      - name: Test integrated chat composition
        run: node scripts/test-normal-chat-integration.mjs
      - name: Test integrated media composition
        run: node scripts/test-normal-media-integration.mjs
      - name: Test integrated status composition
        run: node scripts/test-normal-status-integration.mjs
      - name: Build isolated modular candidate
        run: node scripts/build-normal-modular-candidate.mjs
      - name: Execute modular candidate in isolated Deno runtime
        run: npx --yes deno@2.2.8 run --allow-run --allow-read --config scripts/deno-entrypoint-test/deno.json --allow-env=SUPABASE_URL,SUPABASE_SECRET_KEYS,LUCCA_PASSWORD,YCARO_PASSWORD --allow-net=0.0.0.0:8000,127.0.0.1:8000,0.0.0.0:8001,127.0.0.1:8001 scripts/deno-entrypoint-test/run.ts
      - name: Parse and bundle integrated modular candidate
        run: npx --yes esbuild@0.25.12 dist/modular-normal-candidate/index.ts --bundle --format=esm --platform=neutral --external:npm:* --external:node:* --outfile=/tmp/upstatus-modular-syntax-check.js
