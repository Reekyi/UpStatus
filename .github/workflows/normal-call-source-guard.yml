name: Normal Authenticated Call Source Guard

on:
  push:
    branches:
      - fix/normal-call-source-provenance-20261110
    paths:
      - "src/userscript/upstatus.user.template.js"
      - "src/userscript/signaling-transport.mjs"
      - "scripts/signaling-transport.test.mjs"
      - "scripts/public-call-discovery-guard.test.mjs"
      - "scripts/chat-regression.test.mjs"
      - "scripts/validate.mjs"
      - ".github/workflows/normal-call-source-guard.yml"

permissions:
  contents: read

jobs:
  offline-call-source-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Node runtime and test syntax
        run: |
          node --version
          node --check scripts/signaling-transport.test.mjs
          node --check scripts/public-call-discovery-guard.test.mjs
          node --check scripts/chat-regression.test.mjs
      - name: Run complete offline Normal validation
        run: node scripts/validate.mjs
