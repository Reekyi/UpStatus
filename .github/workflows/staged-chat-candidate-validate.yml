name: Staged Chat Candidate Validate

on:
  push:
    branches:
      - fix/master-staged-chat-attachments-20261111

permissions:
  contents: read

concurrency:
  group: staged-chat-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Validate build and chat regressions
        run: node scripts/validate.mjs
