name: UpStatus Deploy PRODUCTION

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      EXPECTED_SUPABASE_PROJECT_ID: dlfvkawaiqduhlazsszm
    steps:
      - name: Checkout approved release ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require approved release ref and production project
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "::error::Production deploy is allowed only from refs/heads/master."
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::Checkout SHA does not match the dispatched release SHA."
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_ID" ] || [ "$SUPABASE_PROJECT_ID" != "$EXPECTED_SUPABASE_PROJECT_ID" ]; then
            echo "::error::SUPABASE_PROJECT_ID does not match the approved production project."
            exit 1
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is required."
            exit 1
          fi
      - name: Require explicitly approved stable release
        run: |
          node -e "const r=require('./release.json'); if(r.preRelease || r.version !== '3.4.7') { console.error('Production locked: only explicitly approved stable release 3.4.7 may be deployed.'); process.exit(1); }"
      - name: Validate stable build
        run: node scripts/validate.mjs
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.122.1
      - name: Deploy PRODUCTION only
        run: supabase functions deploy upstatus --project-ref "$SUPABASE_PROJECT_ID" --use-api
