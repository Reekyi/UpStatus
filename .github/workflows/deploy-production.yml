name: Team Lite legacy production deployment (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  block_legacy_dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse the legacy production deployment
        shell: bash
        run: |
          echo "::error::This legacy Team Lite workflow is disabled because it targets the Normal Edge Function 'upstatus'. Use the reviewed default-branch Team Lite dispatcher only after all release gates pass and Ricardo explicitly authorizes the release."
          exit 1
