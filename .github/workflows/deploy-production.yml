name: UpStatus Deploy PRODUCTION

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstatus-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      EXPECTED_PRODUCTION_PROJECT_ID: dlfvkawaiqduhlazsszm
      EXPECTED_ISOLATED_SIGNALING_PROJECT_ID: bfpjtfqlnypisxljoxkb
      EXPECTED_SUPABASE_ORGANIZATION_ID: bcjtvojfkfoxvsitzmkl
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require master ref and exact checkout SHA
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "::error::Production deployment is allowed only from refs/heads/master."
            exit 1
          fi
          checked_out_sha="$(git rev-parse HEAD)"
          if [ -z "$GITHUB_SHA" ] || [ "$checked_out_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Checked-out commit does not match the workflow dispatch SHA."
            exit 1
          fi
      - name: Validate stable build
        run: node scripts/validate.mjs
      - name: Require coordinated production API cutover
        run: node scripts/verify-production-cutover.mjs --enforce
      - name: Verify production project with Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: node scripts/verify-production-project.mjs
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.122.1
      - name: Deploy PRODUCTION API before userscript distribution
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase functions deploy upstatus-screen-share-3-1-1-beta10 --project-ref "$SUPABASE_PROJECT_ID" --use-api
          supabase functions deploy upstatus --project-ref "$SUPABASE_PROJECT_ID" --use-api
