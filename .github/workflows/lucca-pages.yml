name: Deploy Lucca Portal

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "lucca-site/**"
      - ".github/workflows/lucca-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Lucca site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./lucca-site"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
