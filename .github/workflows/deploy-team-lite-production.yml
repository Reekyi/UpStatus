name: Team Lite Production Dispatcher

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current HEAD SHA of team-lite-official
        required: true
        type: string
      approved_pr_number:
        description: Merged, human-approved PR that produced this exact release SHA
        required: true
        type: number
      release_version:
        description: Exact stable Team Lite buildVersion from team-lite/release.json
        required: true
        type: string
      confirm_production_deploy:
        description: Explicit authorization to deploy Team Lite to production
        required: true
        type: boolean
        default: false
  push:
    branches:
      - fix/team-lite-production-dispatcher-master-20261109
    paths:
      - ".github/workflows/deploy-team-lite-production.yml"
      - "scripts/test-team-lite-production-dispatcher.mjs"
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/deploy-team-lite-production.yml"
      - "scripts/test-team-lite-production-dispatcher.mjs"

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  offline_guard:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout dispatcher candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check dispatcher test syntax
        run: node --check scripts/test-team-lite-production-dispatcher.mjs
      - name: Run offline dispatcher contract
        run: node scripts/test-team-lite-production-dispatcher.mjs

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.confirm_production_deploy == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: upstatus-team-lite-production-deploy
      queue: max
      cancel-in-progress: false
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      APPROVED_PR_NUMBER: ${{ inputs.approved_pr_number }}
      RELEASE_VERSION: ${{ inputs.release_version }}
      CONFIRM_PRODUCTION_DEPLOY: ${{ inputs.confirm_production_deploy }}
      EXPECTED_PRODUCTION_PROJECT_ID: dlfvkawaiqduhlazsszm
      EXPECTED_SUPABASE_ORGANIZATION_ID: bcjtvojfkfoxvsitzmkl
      EXPECTED_ISOLATED_SIGNALING_PROJECT_ID: bfpjtfqlnypisxljoxkb
      EXPECTED_CURRENT_TEAM_LITE_VERSION: "3.4.30"
    steps:
      - name: Require default-branch dispatch and explicit confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "::error::Team Lite production dispatch is available only from the default master branch."
            exit 1
          fi
          if [ "$GITHUB_REPOSITORY" != "Reekyi/UpStatus" ]; then
            echo "::error::Unexpected repository; refusing production deployment."
            exit 1
          fi
          if [ "$CONFIRM_PRODUCTION_DEPLOY" != "true" ]; then
            echo "::error::Explicit production confirmation is required."
            exit 1
          fi
          if ! [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release_sha must be a full 40-character commit SHA."
            exit 1
          fi
          if ! [[ "$APPROVED_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::approved_pr_number must identify a merged Team Lite release PR."
            exit 1
          fi
          if [ -z "$RELEASE_VERSION" ]; then
            echo "::error::release_version is required."
            exit 1
          fi

      - name: Require release SHA to equal current team-lite-official HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Reekyi/UpStatus/git/ref/heads/team-lite-official")"
          current_sha="$(printf '%s' "$response" | jq -er '.object.sha')"
          if [ "$current_sha" != "$RELEASE_SHA" ]; then
            echo "::error::release_sha is not the current team-lite-official HEAD; refusing stale or unreviewed source."
            exit 1
          fi

      - name: Checkout default-branch dispatcher source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require an approved merged PR for the exact release SHA
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTATUS_RELEASE_REVIEWERS: ${{ vars.UPSTATUS_RELEASE_REVIEWERS }}
        shell: bash
        run: |
          set -euo pipefail
          pr_url="https://api.github.com/repos/Reekyi/UpStatus/pulls/$APPROVED_PR_NUMBER"
          pr_json="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" "$pr_url")"
          pr_state="$(printf '%s' "$pr_json" | jq -er '.state')"
          merged_at="$(printf '%s' "$pr_json" | jq -r '.merged_at // empty')"
          base_ref="$(printf '%s' "$pr_json" | jq -r '.base.ref // empty')"
          merge_sha="$(printf '%s' "$pr_json" | jq -r '.merge_commit_sha // empty')"
          head_repo="$(printf '%s' "$pr_json" | jq -r '.head.repo.full_name // empty')"
          author_login="$(printf '%s' "$pr_json" | jq -r '.user.login // empty')"
          head_sha="$(printf '%s' "$pr_json" | jq -r '.head.sha // empty')"
          if [ "$pr_state" != "closed" ] || [ -z "$merged_at" ] || \
             [ "$base_ref" != "team-lite-official" ] || [ "$merge_sha" != "$RELEASE_SHA" ] || \
             [ "$head_repo" != "Reekyi/UpStatus" ] || [ -z "$author_login" ] || [ -z "$head_sha" ]; then
            echo "::error::approved_pr_number must be merged into team-lite-official and produce the exact release SHA."
            exit 1
          fi

          reviews="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$pr_url/reviews?per_page=100")"
          review_count="$(printf '%s' "$reviews" | jq -er 'length')"
          if [ "$review_count" -ge 100 ]; then
            echo "::error::Review history exceeds one page; refusing an incomplete approval audit."
            exit 1
          fi
          printf '%s' "$reviews" > "$RUNNER_TEMP/team-lite-release-reviews.json"
          node scripts/verify-team-lite-release-review.mjs \
            "$RUNNER_TEMP/team-lite-release-reviews.json" \
            "$head_sha" \
            "$author_login" \
            "$UPSTATUS_RELEASE_REVIEWERS"

          checks="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Reekyi/UpStatus/commits/$head_sha/check-runs?per_page=100")"
          check_count="$(printf '%s' "$checks" | jq -er '.total_count')"
          returned_check_count="$(printf '%s' "$checks" | jq -er '.check_runs | length')"
          bad_checks="$(printf '%s' "$checks" | jq -er '[.check_runs[] | select(.status != "completed" or (.conclusion != "success" and .conclusion != "skipped"))] | length')"
          if [ "$check_count" -lt 1 ] || [ "$check_count" -ne "$returned_check_count" ] || [ "$bad_checks" -ne 0 ]; then
            echo "::error::The approved PR head must have a complete, paginated, successful check-run set."
            exit 1
          fi

      - name: Checkout exact Team Lite release candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Verify exact source and required candidate tooling
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [ "$checked_out_sha" != "$RELEASE_SHA" ]; then
            echo "::error::Checked-out SHA does not match release_sha."
            exit 1
          fi
          for file in \
            scripts/verify-team-lite-release.mjs \
            scripts/team-lite-candidate-check.mjs \
            scripts/test-team-lite-production-deploy.mjs \
            scripts/verify-team-lite-production-project.mjs \
            scripts/verify-team-lite-production-migrations.mjs \
            scripts/migration-layout.test.mjs; do
            if [ ! -f "$file" ]; then
              echo "::error::Required reviewed Team Lite candidate file is absent: $file"
              exit 1
            fi
          done
          if ! grep -q "assertTeamLiteProductionMainBranch" scripts/verify-team-lite-production-project.mjs; then
            echo "::error::Reviewed Team Lite candidate lacks the managed-main health preflight."
            exit 1
          fi
          if ! grep -q "assertRemoteMigrationsHaveLocalFiles" scripts/verify-team-lite-production-migrations.mjs; then
            echo "::error::Reviewed Team Lite candidate lacks complete remote/local migration reconciliation."
            exit 1
          fi

      - name: Build and validate exact Team Lite candidate
        run: |
          node scripts/verify-team-lite-release.mjs "$RELEASE_VERSION"
          node scripts/build.mjs
          node scripts/team-lite-candidate-check.mjs
          node scripts/test-team-lite-production-deploy.mjs
          node scripts/migration-layout.test.mjs

      - name: Verify exact production project with read-only Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: node scripts/verify-team-lite-production-project.mjs

      - name: Verify required production migrations are already applied (read-only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: node scripts/verify-team-lite-production-migrations.mjs

      - name: Setup pinned Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.122.1

      - name: Deploy Team Lite function only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase functions deploy --no-verify-jwt upstatus-team-lite --project-ref "$SUPABASE_PROJECT_ID" --use-api
