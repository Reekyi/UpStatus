name: Team Lite Production Dispatcher

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current HEAD SHA of team-lite-official
        required: true
        type: string
      release_version:
        description: Exact stable Team Lite buildVersion from team-lite/release.json
        required: true
        type: string
      confirm_production_deploy:
        description: Explicit authorization to deploy Team Lite to production
        required: true
        type: boolean
        default: false
  push:
    branches:
      - fix/team-lite-production-dispatcher-master-20261109
    paths:
      - ".github/workflows/deploy-team-lite-production.yml"
      - "scripts/test-team-lite-production-dispatcher.mjs"
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/deploy-team-lite-production.yml"
      - "scripts/test-team-lite-production-dispatcher.mjs"

permissions:
  contents: read

jobs:
  offline_guard:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout dispatcher candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check dispatcher test syntax
        run: node --check scripts/test-team-lite-production-dispatcher.mjs
      - name: Run offline dispatcher contract
        run: node scripts/test-team-lite-production-dispatcher.mjs

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.confirm_production_deploy == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: upstatus-team-lite-production-deploy
      queue: max
      cancel-in-progress: false
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      RELEASE_VERSION: ${{ inputs.release_version }}
      CONFIRM_PRODUCTION_DEPLOY: ${{ inputs.confirm_production_deploy }}
      EXPECTED_PRODUCTION_PROJECT_ID: dlfvkawaiqduhlazsszm
      EXPECTED_SUPABASE_ORGANIZATION_ID: bcjtvojfkfoxvsitzmkl
      EXPECTED_ISOLATED_SIGNALING_PROJECT_ID: bfpjtfqlnypisxljoxkb
      EXPECTED_CURRENT_TEAM_LITE_VERSION: "3.4.30"
    steps:
      - name: Require default-branch dispatch and explicit confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "::error::Team Lite production dispatch is available only from the default master branch."
            exit 1
          fi
          if [ "$GITHUB_REPOSITORY" != "Reekyi/UpStatus" ]; then
            echo "::error::Unexpected repository; refusing production deployment."
            exit 1
          fi
          if [ "$CONFIRM_PRODUCTION_DEPLOY" != "true" ]; then
            echo "::error::Explicit production confirmation is required."
            exit 1
          fi
          if ! [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release_sha must be a full 40-character commit SHA."
            exit 1
          fi
          if [ -z "$RELEASE_VERSION" ]; then
            echo "::error::release_version is required."
            exit 1
          fi

      - name: Require release SHA to equal current team-lite-official HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Reekyi/UpStatus/git/ref/heads/team-lite-official")"
          current_sha="$(printf '%s' "$response" | jq -er '.object.sha')"
          if [ "$current_sha" != "$RELEASE_SHA" ]; then
            echo "::error::release_sha is not the current team-lite-official HEAD; refusing stale or unreviewed source."
            exit 1
          fi

      - name: Checkout exact Team Lite release candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Verify exact source and required candidate tooling
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [ "$checked_out_sha" != "$RELEASE_SHA" ]; then
            echo "::error::Checked-out SHA does not match release_sha."
            exit 1
          fi
          for file in \
            scripts/verify-team-lite-release.mjs \
            scripts/team-lite-candidate-check.mjs \
            scripts/test-team-lite-production-deploy.mjs \
            scripts/verify-team-lite-production-project.mjs \
            scripts/verify-team-lite-production-migrations.mjs \
            scripts/migration-layout.test.mjs; do
            if [ ! -f "$file" ]; then
              echo "::error::Required reviewed Team Lite candidate file is absent: $file"
              exit 1
            fi
          done

      - name: Build and validate exact Team Lite candidate
        run: |
          node scripts/verify-team-lite-release.mjs "$RELEASE_VERSION"
          node scripts/build.mjs
          node scripts/team-lite-candidate-check.mjs
          node scripts/test-team-lite-production-deploy.mjs
          node scripts/migration-layout.test.mjs

      - name: Verify exact production project with read-only Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: node scripts/verify-team-lite-production-project.mjs

      - name: Verify required production migrations are already applied (read-only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: node scripts/verify-team-lite-production-migrations.mjs

      - name: Setup pinned Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.122.1

      - name: Deploy Team Lite function only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase functions deploy --no-verify-jwt upstatus-team-lite --project-ref "$SUPABASE_PROJECT_ID" --use-api
