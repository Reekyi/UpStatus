<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020">
<title>UpStatus Safari Lab</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#e8edf7;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:0 auto;padding:18px 14px 32px}
h1{margin:0 0 4px;font-size:22px}.sub{color:#9aa8bc;font-size:12px;margin-bottom:16px}.card{background:#141c2b;border:1px solid #2d3a50;border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.step{display:flex;gap:10px;align-items:flex-start}.dot{width:12px;height:12px;border-radius:50%;background:#66758a;margin-top:4px;flex:0 0 auto}.dot.ok{background:#43d17a}.dot.fail{background:#ff5f73}.dot.run{background:#6ea0ff}
.name{font-weight:700}.state{font-size:12px;color:#9aa8bc}button{border:0;border-radius:10px;padding:10px 12px;background:#2b3a56;color:#fff;font-weight:700}button.primary{background:#4e7cff}button:disabled{opacity:.55}
pre{white-space:pre-wrap;word-break:break-word;background:#0d1422;border:1px solid #243147;border-radius:10px;padding:10px;font-size:11px;max-height:280px;overflow:auto}.statusline{margin-top:10px;padding:10px;border-radius:10px;background:#101827;color:#b9c5d8}
</style></head><body><div class="wrap">
<h1>UpStatus • Safari Lab</h1><div class="sub">Ambiente de teste. Não altera o UpStatus de produção.</div>
<div class="card"><div class="row"><div><b>Execução</b><div id="overall" class="state">Aguardando</div></div><div style="display:flex;gap:8px"><button id="run" class="primary">Rodar teste</button><button id="stop">Limpar</button></div></div></div>
<div id="steps"></div>
<div class="card"><div class="row"><b>Console do laboratório</b><button id="copy">Copiar</button></div><pre id="log">Pronto.</pre></div>
<div class="card"><b>Diagnóstico final</b><div id="diag" class="statusline">Execute o teste.</div></div>
</div>
<script>
(function(){
'use strict';
const SCRIPT_URL='https://dlfvkawaiqduhlazsszm.supabase.co/functions/v1/upstatus/upstatus.user.js';
const SUPABASE_UMD='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
const $=id=>document.getElementById(id);
const steps=[['page','Página / DOM'],['supabase','Supabase JS'],['download','Download do userscript'],['compile','Compilação'],['gm','APIs GM_*'],['runtime','Execução do UpStatus'],['ui','Interface / DOM'],['sale','Ambiente Sale Smartly']];
const state={logLines:[],results:{},runtimeError:null,scriptSource:''};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function log(msg,obj){const line='['+new Date().toLocaleTimeString()+'] '+msg+(obj!==undefined?' '+JSON.stringify(obj):'');state.logLines.push(line);$('log').textContent=state.logLines.join('\n');}
function setStep(id,status,text){state.results[id]={status,text};renderSteps();}
function renderSteps(){$('steps').innerHTML=steps.map(([id,name])=>{const r=state.results[id]||{status:'pending',text:'Aguardando'};return '<div class="card"><div class="step"><span class="dot '+(r.status==='ok'?'ok':r.status==='fail'?'fail':r.status==='run'?'run':'')+'"></span><div><div class="name">'+esc(name)+'</div><div class="state">'+esc(r.text)+'</div></div></div></div>';}).join('');}
function ok(id,msg){setStep(id,'ok',msg);log('OK • '+id+': '+msg);}
function fail(id,msg,err){setStep(id,'fail',msg);state.runtimeError=err||state.runtimeError;log('ERRO • '+id+': '+msg,err?{name:err.name,message:err.message,stack:err.stack}:undefined);}
async function timeout(p,ms,label){let t;const q=new Promise((_,rej)=>t=setTimeout(()=>rej(new Error(label+' excedeu '+ms+'ms.')),ms));try{return await Promise.race([p,q]);}finally{clearTimeout(t);}}
async function probePage(){setStep('page','run','Testando DOM e APIs básicas…');try{if(!document.body)throw new Error('document.body ausente');log('APIs',{fetch:typeof fetch,URL:typeof URL,Blob:typeof Blob,CustomEvent:typeof CustomEvent,Audio:typeof Audio,Notification:typeof Notification,MediaRecorder:typeof MediaRecorder,AudioContext:typeof(window.AudioContext||window.webkitAudioContext)});ok('page','DOM disponível em '+location.host);}catch(e){fail('page','Falha no ambiente base',e);}}
function loadScript(url){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=url;s.onload=resolve;s.onerror=()=>reject(new Error('Falha ao carregar Supabase JS'));document.head.appendChild(s);});}
async function probeSupabase(){setStep('supabase','run','Carregando Supabase JS…');try{if(!window.supabase?.createClient)await timeout(loadScript(SUPABASE_UMD),10000,'Supabase JS');if(!window.supabase?.createClient)throw new Error('window.supabase.createClient não encontrado');ok('supabase','Supabase JS disponível');}catch(e){fail('supabase','Não foi possível carregar o Supabase JS',e);}}
async function probeDownload(){setStep('download','run','Baixando userscript remoto…');try{const url=SCRIPT_URL+'?safari_lab='+Date.now();const r=await timeout(fetch(url,{cache:'no-store',credentials:'omit',headers:{Accept:'text/javascript,*/*;q=0.8'}}),15000,'Download do userscript');const ct=r.headers.get('content-type')||'';const text=await r.text();state.scriptSource=text;if(!r.ok)throw new Error('HTTP '+r.status);if(!text.includes('// ==UserScript=='))throw new Error('Resposta não parece um userscript');log('Download',{status:r.status,bytes:text.length,contentType:ct,version:(text.match(/@version\s+([^\n]+)/)||[])[1]||'?'});ok('download','Recebidos '+text.length.toLocaleString('pt-BR')+' bytes');}catch(e){fail('download','Falha no download/CORS/rede',e);}}
function compile(src){setStep('compile','run','Compilando bundle…');try{const fn=new Function(String(src)+'\n//# sourceURL=UpStatus-Safari-Lab.user.js');ok('compile','Compilou sem erro de sintaxe');return fn;}catch(e){fail('compile','Erro de compilação/sintaxe',e);return null;}}
function installGM(){const p='upstatus_safari_lab_';const get=(k,d)=>{try{const v=localStorage.getItem(p+k);return v===null?d:JSON.parse(v);}catch{return d;}};const set=(k,v)=>{try{localStorage.setItem(p+k,JSON.stringify(v));}catch{}};window.GM_getValue=get;window.GM_setValue=set;window.GM_openInTab=(url)=>{log('GM_openInTab interceptado',url);return {onclose:null};};window.GM_xmlhttpRequest=(o)=>{fetch(o.url,{method:o.method||'GET',headers:o.headers||{},body:o.data,credentials:'include',cache:'no-store'}).then(async r=>{const payload={status:r.status,responseText:o.responseType==='blob'?'':await r.text(),response:o.responseType==='blob'?await r.blob():undefined};log('GM_xmlhttpRequest '+(o.method||'GET')+' '+o.url+' ['+r.status+']');o.onload?.(payload);}).catch(e=>{log('GM_xmlhttpRequest erro',{url:o.url,message:e.message});o.onerror?.(e);});};ok('gm','GM APIs instaladas');}
function installSaleMock(){window.__upstatusMembers=['Ricardo','Lohan','Guilherme'];const oldFetch=window.fetch;if(!window.__upstatusFetchWrapped){window.__upstatusFetchWrapped=true;window.fetch=function(input,init){const raw=typeof input==='string'?input:input?.url||'';if(String(raw).includes('api.salesmartly.com/sys/project/user-list/online-switch')){log('Sale Smartly MOCK → online-switch');return Promise.resolve(new Response(JSON.stringify({code:0,msg:'ok'}),{status:200,headers:{'Content-Type':'application/json'}}));}return oldFetch.apply(this,arguments);};}ok('sale','Mock básico instalado para API do Sale Smartly');}
function execute(fn){setStep('runtime','run','Executando userscript…');const onerr=e=>{const err=e.error||new Error(e.message||'Erro global');state.runtimeError=err;log('window.error',{message:err.message,source:e.filename,line:e.lineno,col:e.colno});};const onrej=e=>{const err=e.reason instanceof Error?e.reason:new Error(String(e.reason));state.runtimeError=err;log('unhandledrejection',{message:err.message,stack:err.stack});};window.addEventListener('error',onerr,{once:true});window.addEventListener('unhandledrejection',onrej,{once:true});try{const ret=fn();log('fn() retornou',{type:typeof ret});ok('runtime','Executou sem exceção síncrona');return true;}catch(e){fail('runtime','Userscript lançou exceção síncrona',e);return false;}}
function inspectUI(){setStep('ui','run','Procurando a interface criada…');setTimeout(()=>{const ids=['upstatus-root','upstatus-bubble','upstatus-card','upstatus-chat'];const found=ids.filter(x=>document.getElementById(x));if(found.length)ok('ui','Detectado: '+found.join(', '));else fail('ui','Nenhum elemento do UpStatus foi criado',new Error('UI ausente'));},1200);}
function finalize(){const vals=Object.values(state.results),fails=vals.filter(x=>x.status==='fail').length,oks=vals.filter(x=>x.status==='ok').length;let m;if(state.results.download?.status==='fail')m='Falhou antes da execução: rede/CORS/download.';else if(state.results.compile?.status==='fail')m='Baixou, mas não compilou: incompatibilidade de sintaxe/bundle.';else if(state.results.runtime?.status==='fail'||state.runtimeError)m='Baixou e compilou, mas caiu durante a inicialização.';else if(state.results.ui?.status==='fail')m='Executou, mas não criou UI: forte indício de dependência do host Sale Smartly.';else m='Laboratório terminou sem falha crítica detectada.';$('overall').textContent=oks+' OK • '+fails+' falhas';$('diag').innerHTML=esc(m)+(state.runtimeError?'<br><br><b>Erro:</b> '+esc(state.runtimeError.message||state.runtimeError):'');}
async function run(){state.logLines=[];state.results={};state.runtimeError=null;state.scriptSource='';$('log').textContent='';$('diag').textContent='Executando diagnóstico…';renderSteps();await probePage();if(state.results.page.status==='fail'){finalize();return;}await probeSupabase();if(state.results.supabase.status==='fail'){finalize();return;}await probeDownload();if(state.results.download.status==='fail'){finalize();return;}const fn=compile(state.scriptSource);if(!fn){finalize();return;}installGM();installSaleMock();if(!execute(fn)){finalize();return;}inspectUI();setTimeout(finalize,1800);}
function clearLab(){try{Object.keys(localStorage).filter(k=>k.startsWith('upstatus_safari_lab_')).forEach(k=>localStorage.removeItem(k));}catch{};['upstatus-root','upstatus-bubble','upstatus-card','upstatus-chat'].forEach(id=>document.getElementById(id)?.remove());location.reload();}
$('run').onclick=run;$('stop').onclick=clearLab;$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('log').textContent);$('copy').textContent='Copiado';setTimeout(()=>$('copy').textContent='Copiar',1200);}catch{alert('Não consegui copiar.')}};renderSteps();log('Laboratório inicializado.');
})();
</script></body></html>
